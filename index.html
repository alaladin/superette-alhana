    <script>
      (function() {
        // Intercept Vite HMR WebSocket in AI Studio preview environments where WebSocket is blocked
        if (typeof window !== 'undefined') {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = String(protocols || '');
              if (protoStr.includes('vite-hmr') || urlStr.includes('vite-hmr') || urlStr.includes('token=')) {
                var target = new EventTarget();
                target.readyState = 1;
                target.OPEN = 1;
                target.CLOSED = 3;
                target.CLOSING = 2;
                target.CONNECTING = 0;
                target.send = function() {};
                target.close = function() {};
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          }

          // Global suppression for any WebSocket unhandled rejections or errors
          window.addEventListener('unhandledrejection', function(event) {
            var msg = (event.reason && (event.reason.message || event.reason.stack)) || String(event.reason || '');
            if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });

          window.addEventListener('error', function(event) {
            var msg = event.message || '';
            if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });

          // Suppress Vite failed to connect to websocket console errors
          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) { return String(a || ''); }).join(' ');
            if (text.includes('WebSocket closed without opened') || text.includes('[vite] failed to connect to websocket')) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }
      })();
    </script>
